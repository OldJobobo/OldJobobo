name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "24 13 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test profile generator
        run: node --test scripts/generate-profile.test.mjs

      - name: Generate profile Markdown
        run: node scripts/generate-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated changes
        run: |
          if git diff --quiet -- README.md THEMES.md; then
            echo "No generated profile changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md THEMES.md
          git commit -m "Update generated profile sections"
          git push
