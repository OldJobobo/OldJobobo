name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "24 13 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test profile generator
        run: node --test scripts/generate-profile.test.mjs

      - name: Generate profile Markdown
        run: node scripts/generate-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-profile
          delete-branch: true
          title: Update generated profile sections
          commit-message: Update generated profile sections
          body: |
            Automated profile refresh from GitHub repository metadata.

            Theme gallery source:
            - public, non-fork repos named `omarchy-<name>-theme`
            - root `preview.png`
            - root `.omarchy-theme.yml` with `gallery: true`
            - `category: productivity` or `category: novelty`

            Project source:
            - `profile-project` topic
            - seeded profile project list
